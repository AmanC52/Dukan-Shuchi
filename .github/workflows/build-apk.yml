name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply Royal Blue 3D App Icon to Android Mipmaps
        run: |
          cp -r android-res/* android/app/src/main/res/

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK to repository folder
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Dukan-Sahayak.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dukan-Sahayak-Mobile-App
          path: apk/Dukan-Sahayak.apk
          if-no-files-found: warn

      - name: Create GitHub Release with Direct Download APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "दुकान सहायक v2.0 - Android Mobile App"
          body: |
            ### 📱 दुकान सहायक (Dukan Assistant) - Android APK Direct Download
            
            नीचे दी गई फाइल पर क्लिक करके सीधे अपने मोबाइल में ऐप डाउनलोड करें:
            - **[Dukan-Sahayak.apk](https://github.com/AmanC52/Dukan-Shuchi/releases/download/v2.0/Dukan-Sahayak.apk)**
          files: |
            apk/Dukan-Sahayak.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK directly to Home Screen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/Dukan-Sahayak.apk
          if git diff --staged --quiet; then
            echo "No changes in APK"
          else
            git commit -m "release: update Dukan-Sahayak.apk with new app icon on home screen"
            git push origin main
          fi
